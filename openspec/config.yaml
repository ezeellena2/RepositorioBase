# OpenSpec configuration for RepositorioBase.
# Generated by sdd-init on 2026-09-13 from repository configuration only; no test suite or build ran during detection.
# Engram mirrors: sdd-init/repositoriobase (context) and sdd/repositoriobase/testing-capabilities (testing).
schema: spec-driven
project: repositoriobase
artifact_store: hybrid
strict_tdd: true

context: |
  Stack: .NET 10 (SDK 10.0.400) Clean Architecture: Domain, Application (MediatR, FluentValidation, EF Core), Infrastructure (PostgreSQL/Npgsql, ASP.NET Core Identity, MailKit, outbox), Web (Minimal API endpoint groups, OpenAPI), OutboxWorker, Aspire 13.5.3 AppHost.
  SPA: src/Web/ClientApp is React 19 + Vite 8 + Material UI 9 (src/theme.jsx is the only visual policy layer) + i18next (en source, es supported); NSwag client generated from src/Web/wwwroot/openapi/v1.json.
  Authorities: docs/features/identity-access/SPEC.md, docs/features/localization/SPEC.md and PLAN.md, ADRs under docs/decisions/; approved SPECs and accepted ADRs outrank convenience.
  Errors: expected failures are Result/Result<T> carrying one ApplicationError (stable code and category); unexpected failures stay exceptions; one RFC 9457 Problem Details writer.
  Standards: .agents/skills/{engineering,frontend-design,localization,error-handling}-standards plus root CLAUDE.md and AGENTS.md.
  Testing: Strict TDD; Vitest + Testing Library + MSW; NUnit 4 + Shouldly (+ Moq, Respawn, Aspire.Hosting.Testing); Reqnroll + Playwright journeys.
  Delivery (CLAUDE.md): commit directly to main with a conventional message after verification passes; no pull requests or feature branches.

testing:
  detected: 2026-09-13
  spa:
    root: src/Web/ClientApp
    runner: Vitest 3.2 (jsdom, globals, setup src/test/setup.js, css disabled, testTimeout 15000 ms)
    libraries:
      - '@testing-library/react 16'
      - '@testing-library/user-event 14'
      - '@testing-library/jest-dom 7'
      - 'msw 2.15 (onUnhandledRequest: error)'
    test_command: npx vitest run
    lint_command: npx eslint src/
    build_command: npx vite build
    localization_command: npm run i18n:unused
    coverage: unavailable (no @vitest/coverage-* dependency)
    type_checker: not wired (tsconfig.json is strict with noEmit; no tsc script or CI step; source is JavaScript/JSX)
  dotnet:
    runner: NUnit 4.6.1 via Microsoft.NET.Test.Sdk 18.9 and NUnit3TestAdapter 6.3
    assertions: Shouldly 4.3
    analyzers: NUnit.Analyzers 4.14 with TreatWarningsAsErrors (Directory.Build.props)
    coverage: 'coverlet.collector 8.0.1 in Domain.UnitTests, Application.UnitTests, Application.FunctionalTests and Infrastructure.IntegrationTests; dotnet test <project> --collect:"XPlat Code Coverage"; not wired into CI'
    formatter: not wired (.editorconfig only; no dotnet format step)
    layers:
      unit:
        - tests/Domain.UnitTests (NUnit, Shouldly)
        - tests/Application.UnitTests (NUnit, Shouldly, Moq)
      integration:
        - tests/Infrastructure.IntegrationTests (NUnit, Shouldly, Aspire.Hosting.Testing with tests/TestAppHost PostgreSQL container, Microsoft.AspNetCore.Mvc.Testing)
      functional:
        - tests/Application.FunctionalTests (NUnit, Shouldly, Moq, Respawn, Microsoft.AspNetCore.Mvc.Testing, Aspire.Hosting.Testing)
      e2e:
        - tests/Web.AcceptanceTests (Reqnroll.NUnit 3.3.4, Reqnroll.ExternalData, Microsoft.Playwright 1.62, Aspire.Hosting.Testing against src/AppHost; features under Features/, page objects under Pages/)
    project_test_commands:
      - 'dotnet test tests/Domain.UnitTests/Domain.UnitTests.csproj --filter "TestCategory!=IndependentDevelopmentReview"'
      - 'dotnet test tests/Application.UnitTests/Application.UnitTests.csproj --filter "TestCategory!=IndependentDevelopmentReview"'
      - 'dotnet test tests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj --filter "TestCategory!=IndependentDevelopmentReview"'
      - 'dotnet test tests/Application.FunctionalTests/Application.FunctionalTests.csproj --filter "TestCategory!=IndependentDevelopmentReview"'
    ci_form: 'dotnet build --no-restore --configuration Release, then dotnet test <project> --no-build --configuration Release --filter "TestCategory!=IndependentDevelopmentReview", one Aspire-bearing project per process'
  verification:
    # Exact commands from root CLAUDE.md.
    frontend: 'cd src/Web/ClientApp && npx vitest run && npx eslint src/ && npx vite build'
    journeys: 'dotnet test tests/Web.AcceptanceTests/Web.AcceptanceTests.csproj --disable-build-servers -p:UseSharedCompilation=false -p:OpenApiGenerateDocumentsOnBuild=false'
    localization: 'cd src/Web/ClientApp && npm run i18n:unused'
    expected: Every SPA test passes, lint is clean, the build succeeds, every journey passes, and git status shows no changes under tests/ beyond those the change declares.
  prerequisites:
    - Docker for Infrastructure.IntegrationTests, Application.FunctionalTests and the journeys (Aspire starts PostgreSQL containers).
    - Journeys need no AppHost already running; the harness starts its own.
    - Journeys need the gitignored src/Web/wwwroot/openapi/v1.json, produced by building src/Web/Web.csproj without -p:OpenApiGenerateDocumentsOnBuild=false (for example dotnet build src/Web/Web.csproj).
    - Journeys need Playwright Chromium, installed with artifacts/bin/Web.AcceptanceTests/<configuration>/playwright.ps1 install chromium.
    - Run Aspire-bearing suites one project per process; a solution-level dotnet test starts them concurrently and can exhaust the Aspire startup retry window.
  known_baselines:
    # Supplied by the orchestrator at init; not re-run during detection. These are not regressions.
    - 'Full Vitest run, restated 2026-09-13 from the measured baseline at 2716aa6 (offset-pagination-standard task 1.1; full record in that change''s tasks.md). Under parallel load, four tests fail at or beyond 15 s:'
    - 'ExternalProofResume.test.jsx "resumes a roles target beyond the first page exactly once with its original draft and version" times out at the 15 s edge even when its file runs alone (4 of 5 runs).'
    - 'Its "resumes a members target..." sibling fails after 15 s, and IdentityAccessReviewRevalidation.test.jsx R6C roles and members (101 distinct records) time out; all three pass alone.'
    - 'Under 15 s, RolesPage.test.jsx, ExternalProofReturnRevalidation.test.jsx R6A and three more ExternalProofResume tests are load-sensitive and pass alone.'
    - 'Infrastructure.IntegrationTests: the 3 tests in IdentityAccess/IndependentDevelopmentRetentionReviewTests.cs (category IndependentDevelopmentReview) fail on purpose since b9a30d1 as reproductions of confirmed open defects; CI excludes the category; run them deliberately with --filter TestCategory=IndependentDevelopmentReview.'
    - 'Application.FunctionalTests also carries the IndependentDevelopmentReview category (IdentityAccess/Members/IndependentDevelopmentAdministrationReviewTests.cs, 4 tests). At 2716aa6 two fail, Ownership_cannot_be_transferred_to_a_self_deactivated_identity_with_an_active_membership and Suspending_a_member_requires_the_recent_primary_proof_retained_by_accepted_C6, and two pass (measured at offset-pagination-standard task 1.1).'

rules:
  proposal:
    - Include a rollback plan for risky changes.
    - Name the approved SPEC rows, accepted ADRs and docs/features documents the change touches; approved SPECs and accepted ADRs outrank convenience.
    - State whether the change is visual, functional or error-handling work, because CLAUDE.md grants each a different edit scope over *.test.jsx files, page objects under tests/, AppRoutes.jsx and features/*/api/.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Every new or changed human-readable string, API error code, enum value, permission or status specifies its catalog entries in every supported language (en and es).
    - Every new error code specifies its factory, endpoint contract, problemCodes.json entry, client message and test together.
    - Neutral public flows never distinguish account or token state; input-only field errors on them require the error-handling three-part test and a parity test.
  design:
    - Include sequence diagrams for complex flows.
    - Document architecture decisions with rationale while preserving layer duties and the Result/ApplicationError conventions.
    - HTTP never serializes Result envelopes; successes are endpoint-specific DTOs or bodyless statuses, failures are RFC 9457 Problem Details.
    - Rendered SPA work follows frontend-design-standards (standard Material UI imported directly, sx for layout only, src/theme.jsx as the only visual policy layer).
  tasks:
    - Group by phase, use hierarchical numbering.
    - Keep tasks completable in one session.
    - Start each behavior task with a failing test at the narrowest sufficient layer (Strict TDD).
    - Name the verification commands each task runs.
  apply:
    guidelines:
      - Follow existing code patterns and the local standards skills under .agents/skills/.
      - In a visual change never alter an id, name, data-testid, role, heading level, type, autoComplete, required, a disabled expression or the en source value of a user-visible string.
      - Use real PostgreSQL integration tests for guarantees that depend on PostgreSQL semantics.
    tdd: true
    test_command: 'cd src/Web/ClientApp && npx vitest run && npx eslint src/ && npx vite build'
    dotnet_test_commands: see testing.dotnet.project_test_commands
  verify:
    test_command: 'cd src/Web/ClientApp && npx vitest run && npx eslint src/ && npx vite build'
    journey_command: 'dotnet test tests/Web.AcceptanceTests/Web.AcceptanceTests.csproj --disable-build-servers -p:UseSharedCompilation=false -p:OpenApiGenerateDocumentsOnBuild=false'
    build_command: dotnet build --configuration Release
    coverage_threshold: 0
    known_baselines: see testing.known_baselines
  archive:
    - Warn before merging destructive deltas.
