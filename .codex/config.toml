# Keep Codex's built-in model instructions. Gentle AI's repository guidance is
# mirrored to the root AGENTS.md, which Codex loads as project instructions.
project_doc_max_bytes = 131072

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[features]
multi_agent = true

[agents]
max_depth = 2
max_threads = 4

[mcp_servers.engram]
command = "engram"
args = ["mcp", "--tools=agent"]
