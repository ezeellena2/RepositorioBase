name: Build

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.scripts/**'
      - .gitignore
      - CODE_OF_CONDUCT.md
      - LICENSE
      - README.md

  push:
    branches: [ main ]
    paths-ignore:
      - '.scripts/**'
      - .gitignore
      - CODE_OF_CONDUCT.md
      - LICENSE
      - README.md

  workflow_call:
    inputs:
      build-artifacts:
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  #if (!UseApiOnly)
  spa:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/Web/ClientApp

    steps:
    - uses: actions/checkout@v7
      name: Checkout code

    - name: Install Node & cache npm packages
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'
        cache: 'npm'
        cache-dependency-path: src/Web/ClientApp/package-lock.json

    - name: Install SPA dependencies
      run: npm ci

    - name: Test SPA
      run: npx vitest run

    - name: Lint SPA
      run: npx eslint src/
  #endif

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      name: Checkout code

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    #if (!UseApiOnly)
    - name: Install Node & cache npm packages
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'
        cache: 'npm'
        cache-dependency-path: |
          src/Web/ClientApp/package-lock.json
          src/Web/ClientApp-Angular/package-lock.json
    #endif

    - name: Install .NET
      uses: actions/setup-dotnet@v6

    - name: Trust development HTTPS certificate
      run: dotnet dev-certs https --trust

    - name: Restore solution
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore --configuration Release
      
    #if (!UseApiOnly)
    - name: Install Playwright browsers
      run: pwsh artifacts/bin/Web.AcceptanceTests/release/playwright.ps1 install --with-deps chromium
    #endif

    # The IndependentDevelopmentReview category holds reproductions of defects that are
    # confirmed and still open. They fail on purpose, so they are excluded here and run
    # deliberately instead: `dotnet test --filter TestCategory=IndependentDevelopmentReview`.
    # A category that stops failing is a defect that got fixed, and its test belongs back
    # in the run.
    - name: Test solution
      run: dotnet test --no-build --configuration Release --filter "TestCategory!=IndependentDevelopmentReview"
