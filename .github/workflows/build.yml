name: Build

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.scripts/**'
      - .gitignore
      - CODE_OF_CONDUCT.md
      - LICENSE
      - README.md

  push:
    branches: [ main ]
    paths-ignore:
      - '.scripts/**'
      - .gitignore
      - CODE_OF_CONDUCT.md
      - LICENSE
      - README.md

  workflow_call:
    inputs:
      build-artifacts:
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  #if (!UseApiOnly)
  spa:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/Web/ClientApp

    steps:
    - uses: actions/checkout@v7
      name: Checkout code

    - name: Install Node & cache npm packages
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'
        cache: 'npm'
        cache-dependency-path: src/Web/ClientApp/package-lock.json

    - name: Install SPA dependencies
      run: npm ci

    - name: Test SPA
      run: npx vitest run

    - name: Lint SPA
      run: npx eslint src/
  #endif

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      name: Checkout code

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    #if (!UseApiOnly)
    - name: Install Node & cache npm packages
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'
        cache: 'npm'
        cache-dependency-path: |
          src/Web/ClientApp/package-lock.json
          src/Web/ClientApp-Angular/package-lock.json
    #endif

    - name: Install .NET
      uses: actions/setup-dotnet@v6

    - name: Trust development HTTPS certificate
      run: |
        export SSL_CERT_DIR="$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs"
        dotnet dev-certs https --trust
        echo "SSL_CERT_DIR=$SSL_CERT_DIR" >> "$GITHUB_ENV"

    - name: Restore solution
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore --configuration Release
      
    #if (!UseApiOnly)
    - name: Install Playwright browsers
      run: pwsh artifacts/bin/Web.AcceptanceTests/release/playwright.ps1 install --with-deps chromium
    #endif

    # The IndependentDevelopmentReview category holds reproductions of defects that are
    # confirmed and still open. They fail on purpose, so they are excluded here and run
    # deliberately instead: `dotnet test --filter TestCategory=IndependentDevelopmentReview`.
    # A category that stops failing is a defect that got fixed, and its test belongs back
    # in the run.
    # Run each Aspire-bearing suite in its own process. A solution-level `dotnet test` starts them concurrently,
    # which makes their DCP control planes compete and can exhaust Aspire's fixed startup retry window.
    - name: Test Domain unit tests
      run: dotnet test tests/Domain.UnitTests/Domain.UnitTests.csproj --no-build --configuration Release --filter "TestCategory!=IndependentDevelopmentReview"

    - name: Test Application unit tests
      run: dotnet test tests/Application.UnitTests/Application.UnitTests.csproj --no-build --configuration Release --filter "TestCategory!=IndependentDevelopmentReview"

    - name: Test Infrastructure integration tests
      run: dotnet test tests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj --no-build --configuration Release --filter "TestCategory!=IndependentDevelopmentReview"

    - name: Test Application functional tests
      run: dotnet test tests/Application.FunctionalTests/Application.FunctionalTests.csproj --no-build --configuration Release --filter "TestCategory!=IndependentDevelopmentReview"

    #if (!UseApiOnly)
    - name: Test Web acceptance journeys
      env:
        DCP_DIAGNOSTICS_LOG_LEVEL: info
        DCP_DIAGNOSTICS_LOG_FOLDER: ${{ github.workspace }}/artifacts/dcp/acceptance
      run: >-
        dotnet test tests/Web.AcceptanceTests/Web.AcceptanceTests.csproj
        --no-build
        --configuration Release
        --filter "TestCategory!=IndependentDevelopmentReview"
        --logger "trx;LogFileName=acceptance.trx"
        --results-directory artifacts/test-results/acceptance

    - name: Upload acceptance failure diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: acceptance-failure-diagnostics
        if-no-files-found: warn
        retention-days: 7
        path: |
          artifacts/test-results/acceptance/*.trx
          artifacts/dcp/acceptance/**
    #endif
