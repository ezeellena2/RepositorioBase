name: Test Templates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-template:
    name: ${{ matrix.client-framework }}-postgresql
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        client-framework: [angular, react, none]

    steps:
    - uses: actions/checkout@v7
      name: Checkout code

    - name: Install .NET
      uses: actions/setup-dotnet@v6

    - name: Install Node & cache npm packages
      if: matrix.client-framework != 'none'
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'
        cache: 'npm'
        cache-dependency-path: |
          src/Web/ClientApp/package-lock.json
          src/Web/ClientApp-Angular/package-lock.json

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ matrix.client-framework }}-postgresql-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Install template
      run: dotnet new install .

    - name: Generate solution
      run: |
        dotnet new ca-sln \
          --client-framework ${{ matrix.client-framework }} \
          --database postgresql \
          --name CleanArchitecture \
          --output generated \
          --no-update-check

    - name: Generate and inspect command and query use cases
      working-directory: generated/src/Application
      run: |
        dotnet new ca-usecase --name GeneratedCommand --feature-name TemplateGate --usecase-type command --no-update-check
        dotnet new ca-usecase --name GeneratedQuery --feature-name TemplateGate --usecase-type query --no-update-check
        grep -F '.WithErrorCode(ValidationErrorCodes.Required);' TemplateGate/Commands/GeneratedCommand/GeneratedCommand.cs
        grep -F '.WithErrorCode(ValidationErrorCodes.Required);' TemplateGate/Queries/GeneratedQuery/GeneratedQuery.cs

    - name: Build solution
      working-directory: generated
      run: dotnet build --configuration Release

    - name: Build client app
      if: matrix.client-framework != 'none'
      working-directory: generated/src/Web/ClientApp
      run: |
        npm ci
        npm run build

    - name: Install Playwright browsers
      if: matrix.client-framework != 'none'
      working-directory: generated
      run: pwsh artifacts/bin/Web.AcceptanceTests/release/playwright.ps1 install --with-deps chromium

    - name: Test solution
      working-directory: generated
      run: dotnet test --no-build --configuration Release
